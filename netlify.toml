# ===================================
# NETLIFY CONFIGURATION - BESORAH YESHUA MINISTRY
# Optimized for Mobile & Production
# ===================================

[build]
  publish = "."
  command = "echo 'Static site - no build needed'"

# Production context
[build.environment]
  NODE_VERSION = "18"

# ===================================
# REDIRECT RULES - FIXED
# ===================================

# Redirect old URLs to new ones
[[redirects]]
  from = "/home"
  to = "/index.html"
  status = 301
  force = true

[[redirects]]
  from = "/home.html"
  to = "/index.html"
  status = 301
  force = true

# SPA fallback - handles 404s by serving index.html
# IMPORTANT: Only ONE catch-all redirect!
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false  # Don't override existing files

# ===================================
# SECURITY HEADERS
# ===================================

[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    
    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"
    
    # Enable XSS protection
    X-XSS-Protection = "1; mode=block"
    
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Permissions policy
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    
    # Strict Transport Security (HSTS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Content Security Policy - FIXED
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = '''
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' 
        https://cdnjs.cloudflare.com 
        https://unpkg.com 
        https://www.paypal.com 
        https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' 
        https://cdnjs.cloudflare.com;
      img-src 'self' data: https: blob:;
      font-src 'self' 
        https://cdnjs.cloudflare.com;
      connect-src 'self' 
        https://api.anthropic.com 
        https://www.paypal.com;
      frame-src 'self' 
        https://www.paypal.com;
      media-src 'self' data: blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self' 
        https://www.paypal.com;
      frame-ancestors 'none';
      upgrade-insecure-requests;
    '''

# ===================================
# CACHE CONTROL HEADERS - OPTIMIZED
# ===================================

# Cache static assets for 1 year
[[headers]]
  for = "/styles/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/scripts/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts for 1 year
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML files
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache service worker for short time
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache manifest for short time
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# ===================================
# NETLIFY FORMS CONFIGURATION
# ===================================

[forms]
  # Enable spam filtering
  spam_filter = true

